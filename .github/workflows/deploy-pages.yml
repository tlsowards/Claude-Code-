name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild so the course catalog stays in sync with sowardsconsulting.com.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Served at the root of the custom domain attached in the repository's Pages settings.
          # The old https://<owner>.github.io/<repo>/ address redirects there.
          BASE_PATH: /
          VITE_PUBLIC_URL: https://app.sowardsconsulting.com
          VITE_AUDIO_BASE_URL: ${{ vars.AUDIO_BASE_URL }}
          VITE_MAILERLITE_FORM_ACTION: ${{ vars.MAILERLITE_FORM_ACTION }}
          VITE_PAYWALL: ${{ vars.PAYWALL }}
          VITE_SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
